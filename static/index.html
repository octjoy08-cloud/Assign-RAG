<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multimodal RAG System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .main-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .card {
            background: white;
            border-radius: 10px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            transition: transform 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .card h2 {
            color: #667eea;
            margin-bottom: 20px;
            font-size: 1.5em;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: #333;
            font-weight: 500;
        }

        input[type="text"],
        input[type="file"],
        select,
        textarea {
            width: 100%;
            padding: 10px;
            border: 2px solid #e0e0e0;
            border-radius: 5px;
            font-size: 1em;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus,
        textarea:focus,
        select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 5px rgba(102, 126, 234, 0.3);
        }

        textarea {
            resize: vertical;
            min-height: 80px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        button {
            flex: 1;
            padding: 12px 20px;
            border: none;
            border-radius: 5px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .btn-secondary {
            background: #f0f0f0;
            color: #333;
        }

        .btn-secondary:hover {
            background: #e0e0e0;
        }

        .full-width {
            display: flex;
            gap: 10px;
        }

        .full-width button {
            flex: 1;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat-box {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
        }

        .stat-box .number {
            font-size: 2em;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .stat-box .label {
            font-size: 0.9em;
            opacity: 0.9;
        }

        .results-section {
            background: white;
            border-radius: 10px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }

        .results-section h2 {
            color: #667eea;
            margin-bottom: 20px;
        }

        .result-item {
            background: #f9f9f9;
            padding: 15px;
            border-left: 4px solid #667eea;
            margin-bottom: 15px;
            border-radius: 4px;
        }

        .result-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .result-type {
            display: inline-block;
            padding: 4px 12px;
            background: #667eea;
            color: white;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: 600;
        }

        .result-content {
            color: #333;
            line-height: 1.6;
            font-size: 0.95em;
        }

        .result-page {
            color: #999;
            font-size: 0.85em;
            margin-top: 8px;
        }

        .loading {
            text-align: center;
            padding: 20px;
            color: #667eea;
        }

        .loading-spinner {
            border: 4px solid #f0f0f0;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error {
            background: #ff6b6b;
            color: white;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 15px;
        }

        .success {
            background: #51cf66;
            color: white;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 15px;
        }

        .info {
            background: #74c0fc;
            color: white;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 15px;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            border-bottom: 2px solid #e0e0e0;
        }

        .tab-btn {
            padding: 10px 20px;
            background: none;
            border: none;
            border-bottom: 3px solid transparent;
            cursor: pointer;
            font-weight: 600;
            color: #999;
            transition: all 0.3s;
        }

        .tab-btn.active {
            color: #667eea;
            border-bottom-color: #667eea;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: #999;
        }

        .empty-state-icon {
            font-size: 3em;
            margin-bottom: 10px;
        }

        @media (max-width: 768px) {
            .main-grid {
                grid-template-columns: 1fr;
            }

            .stats-grid {
                grid-template-columns: 1fr;
            }

            .header h1 {
                font-size: 1.8em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔍 Multimodal RAG System</h1>
            <p>Retrieve-Augmented Generation for PDF Documents</p>
        </div>

        <div class="main-grid">
            <!-- Document Management Panel -->
            <div class="card">
                <h2>📄 Document Management</h2>
                <div class="form-group">
                    <label>Upload PDF Document</label>
                    <input type="file" id="fileInput" accept=".pdf">
                </div>
                <button class="btn-primary" onclick="uploadDocument()">Upload & Process</button>
                <button class="btn-secondary" onclick="clearAll()">Clear All Data</button>
            </div>

            <!-- Statistics Panel -->
            <div class="card">
                <h2>📊 Vector Store Statistics</h2>
                <div class="stats-grid">
                    <div class="stat-box">
                        <div class="number" id="totalChunks">0</div>
                        <div class="label">Total Chunks</div>
                    </div>
                    <div class="stat-box">
                        <div class="number" id="textChunks">0</div>
                        <div class="label">Text</div>
                    </div>
                    <div class="stat-box">
                        <div class="number" id="tableChunks">0</div>
                        <div class="label">Tables</div>
                    </div>
                </div>
                <div class="stat-box" style="margin-top: 10px;">
                    <div class="number" id="imageChunks">0</div>
                    <div class="label">Images</div>
                </div>
                <button class="btn-secondary" style="width: 100%; margin-top: 15px;" onclick="loadStats()">Refresh Stats</button>
            </div>
        </div>

        <!-- Query Section -->
        <div class="results-section">
            <h2>❓ Ask Questions</h2>

            <div class="form-group">
                <label>Your Question</label>
                <textarea id="queryInput" placeholder="Ask a question about the document..."></textarea>
            </div>

            <div class="form-group">
                <label>Filter by Content Type (Optional)</label>
                <select id="contentType">
                    <option value="">All Types</option>
                    <option value="text">Text Only</option>
                    <option value="table">Tables Only</option>
                    <option value="image">Images Only</option>
                </select>
            </div>

            <div class="tabs">
                <button class="tab-btn active" onclick="switchTab('query')">RAG Query (Generate Answer)</button>
                <button class="tab-btn" onclick="switchTab('retrieve')">Retrieve Chunks (Raw Results)</button>
            </div>

            <div id="query" class="tab-content active">
                <div class="form-group">
                    <label>Include Source Details</label>
                    <select id="includeSources">
                        <option value="true">Yes (with sources)</option>
                        <option value="false">No (answer only)</option>
                    </select>
                </div>
                <button class="btn-primary" onclick="submitQuery()">Search & Generate Answer</button>
            </div>

            <div id="retrieve" class="tab-content">
                <div class="form-group">
                    <label>Number of Results</label>
                    <input type="text" id="numResults" value="5" placeholder="Number of chunks to retrieve">
                </div>
                <button class="btn-primary" onclick="submitRetrieve()">Retrieve Chunks</button>
            </div>
        </div>

        <!-- Results Section -->
        <div class="results-section" style="margin-top: 20px;">
            <h2>📋 Results</h2>
            <div id="resultsContainer">
                <div class="empty-state">
                    <div class="empty-state-icon">🔍</div>
                    <p>Submit a query to see results here</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:8002';

        // Load statistics on page load
        window.addEventListener('load', () => {
            loadStats();
        });

        function switchTab(tabName) {
            // Hide all tab contents
            document.querySelectorAll('.tab-content').forEach(el => {
                el.classList.remove('active');
            });
            document.querySelectorAll('.tab-btn').forEach(el => {
                el.classList.remove('active');
            });

            // Show selected tab
            document.getElementById(tabName).classList.add('active');
            event.target.classList.add('active');
        }

        async function loadStats() {
            try {
                const response = await fetch(`${API_BASE}/stats`);
                if (!response.ok) {
                    const errorText = await response.text();
                    throw new Error(`HTTP ${response.status}: ${errorText}`);
                }
                const data = await response.json();

                document.getElementById('totalChunks').textContent = data.total_chunks || 0;
                document.getElementById('textChunks').textContent = data.chunk_types?.text || 0;
                document.getElementById('tableChunks').textContent = data.chunk_types?.table || 0;
                document.getElementById('imageChunks').textContent = data.chunk_types?.image || 0;
            } catch (error) {
                console.error('Error loading stats:', error);
                let errorMessage = error.message;
                if (error.message.includes('Failed to fetch')) {
                    errorMessage = `Cannot connect to server at ${API_BASE}`;
                }
                showMessage(`Error loading statistics: ${errorMessage}`, 'error');
            }
        }

        async function uploadDocument() {
            const fileInput = document.getElementById('fileInput');
            if (!fileInput.files.length) {
                showMessage('Please select a PDF file', 'error');
                return;
            }

            const formData = new FormData();
            formData.append('file', fileInput.files[0]);

            try {
                showMessage('Uploading and processing document...', 'info');
                const response = await fetch(`${API_BASE}/ingest`, {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) {
                    const errorText = await response.text();
                    throw new Error(`HTTP ${response.status}: ${errorText}`);
                }

                const data = await response.json();
                if (data.error) {
                    showMessage(`Error: ${data.error}`, 'error');
                } else {
                    const types = Object.entries(data.chunk_types)
                        .map(([type, count]) => `${count} ${type}`)
                        .join(', ');
                    showMessage(`✅ Document processed! ${data.chunks} chunks extracted (${types})`, 'success');
                    fileInput.value = '';
                    setTimeout(loadStats, 500);
                }
            } catch (error) {
                console.error('Error uploading document:', error);
                let errorMessage = error.message;
                if (error.message.includes('Failed to fetch')) {
                    errorMessage = `Cannot connect to server. Please ensure the server is running at ${API_BASE}`;
                } else if (error.message.includes('CORS')) {
                    errorMessage = 'CORS error. Please check server configuration.';
                }
                showMessage(`Error uploading document: ${errorMessage}`, 'error');
            }
        }

        async function submitQuery() {
            const query = document.getElementById('queryInput').value.trim();
            if (!query) {
                showMessage('Please enter a question', 'error');
                return;
            }

            const contentType = document.getElementById('contentType').value;
            const includeSources = document.getElementById('includeSources').value === 'true';

            try {
                showLoading();
                const params = new URLSearchParams({
                    q: query,
                    include_sources: includeSources,
                    ...(contentType && { chunk_types: contentType })
                });

                const response = await fetch(`${API_BASE}/query?${params}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' }
                });

                if (!response.ok) throw new Error(`HTTP ${response.status}`);

                const data = await response.json();
                displayQueryResults(data, query);
            } catch (error) {
                console.error('Error querying:', error);
                showMessage(`Error: ${error.message}`, 'error');
            }
        }

        async function submitRetrieve() {
            const query = document.getElementById('queryInput').value.trim();
            if (!query) {
                showMessage('Please enter a search term', 'error');
                return;
            }

            const contentType = document.getElementById('contentType').value;
            const numResults = document.getElementById('numResults').value || 5;

            try {
                showLoading();
                const params = new URLSearchParams({
                    q: query,
                    k: numResults,
                    ...(contentType && { chunk_types: contentType })
                });

                const response = await fetch(`${API_BASE}/retrieve?${params}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' }
                });

                if (!response.ok) throw new Error(`HTTP ${response.status}`);

                const data = await response.json();
                displayRetrieveResults(data, query);
            } catch (error) {
                console.error('Error retrieving:', error);
                showMessage(`Error: ${error.message}`, 'error');
            }
        }

        function displayQueryResults(data, query) {
            let html = `<div><h3>Question: "${query}"</h3>`;

            if (data.answer) {
                html += `<div class="result-item">
                    <div class="result-header">
                        <span class="result-type">ANSWER</span>
                    </div>
                    <div class="result-content">${escapeHtml(data.answer)}</div>
                </div>`;
            }

            if (data.sources && data.sources.length > 0) {
                html += `<h4 style="margin-top: 20px; margin-bottom: 10px; color: #667eea;">📚 Sources (${data.sources.length})</h4>`;
                data.sources.forEach((source, idx) => {
                    const typeColor = {
                        'text': '#667eea',
                        'table': '#764ba2',
                        'image': '#f76707'
                    }[source.type] || '#667eea';

                    html += `<div class="result-item">
                        <div class="result-header">
                            <span class="result-type" style="background: ${typeColor}">${source.type?.toUpperCase() || 'CHUNK'}</span>
                            <span style="color: #999; font-size: 0.9em;">Match: ${(source.similarity * 100).toFixed(1)}%</span>
                        </div>
                        <div class="result-content">${escapeHtml(source.content.substring(0, 300))}${source.content.length > 300 ? '...' : ''}</div>
                        <div class="result-page">📄 Page ${source.page || 'N/A'}</div>
                    </div>`;
                });
            }

            html += `</div>`;
            document.getElementById('resultsContainer').innerHTML = html;
        }

        function displayRetrieveResults(data, query) {
            let html = `<div><h3>Results for: "${query}"</h3>`;

            if (data.results && data.results.length > 0) {
                html += `<p style="color: #666; margin-bottom: 15px;">Found ${data.results.length} matching chunks</p>`;
                data.results.forEach((result, idx) => {
                    const typeColor = {
                        'text': '#667eea',
                        'table': '#764ba2',
                        'image': '#f76707'
                    }[result.type] || '#667eea';

                    html += `<div class="result-item">
                        <div class="result-header">
                            <span style="font-weight: bold; margin-right: 10px;">Chunk ${idx + 1}</span>
                            <span class="result-type" style="background: ${typeColor}">${result.type?.toUpperCase() || 'CHUNK'}</span>
                            <span style="color: #999; font-size: 0.9em; margin-left: auto;">Similarity: ${(result.similarity * 100).toFixed(1)}%</span>
                        </div>
                        <div class="result-content">${escapeHtml(result.content.substring(0, 400))}${result.content.length > 400 ? '...' : ''}</div>
                        <div class="result-page">📄 Page ${result.page || 'N/A'}</div>
                    </div>`;
                });
            } else {
                html += `<div class="empty-state"><p>No results found</p></div>`;
            }

            html += `</div>`;
            document.getElementById('resultsContainer').innerHTML = html;
        }

        async function clearAll() {
            if (!confirm('Are you sure you want to clear all data? This cannot be undone.')) {
                return;
            }

            try {
                showMessage('Clearing data...', 'info');
                const response = await fetch(`${API_BASE}/clear`, {
                    method: 'DELETE'
                });

                if (!response.ok) throw new Error(`HTTP ${response.status}`);

                const data = await response.json();
                showMessage('✅ ' + data.message, 'success');
                setTimeout(loadStats, 500);
                document.getElementById('resultsContainer').innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">🔍</div>
                        <p>Submit a query to see results here</p>
                    </div>
                `;
            } catch (error) {
                console.error('Error clearing:', error);
                showMessage(`Error: ${error.message}`, 'error');
            }
        }

        function showLoading() {
            document.getElementById('resultsContainer').innerHTML = `
                <div class="loading">
                    <div class="loading-spinner"></div>
                    <p>Processing your request...</p>
                </div>
            `;
        }

        function showMessage(message, type) {
            const container = document.getElementById('resultsContainer');
            const messageEl = document.createElement('div');
            messageEl.className = type;
            messageEl.textContent = message;
            container.innerHTML = '';
            container.appendChild(messageEl);
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Allow Enter key to submit query
        document.getElementById('queryInput')?.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && e.ctrlKey) {
                submitQuery();
            }
        });
    </script>
</body>
</html>
